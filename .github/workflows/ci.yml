name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: SDK type check
        run: pnpm typecheck

      - name: SDK build
        run: pnpm build

      - name: Package contents
        run: pnpm pack:check

      - name: Bare example type check
        working-directory: examples/bare
        run: |
          cp example.config.example.json example.config.json
          npx tsc --noEmit
