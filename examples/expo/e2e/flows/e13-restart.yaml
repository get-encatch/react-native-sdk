# E13: identify, then restart the app (state kept). With PERSIST_USER 'false'
# (persistUserAcrossRestarts false) the app comes back as a visitor on the login
# screen; with the default it comes back as the user on Home.
# Env: PERSIST_USER, EXPECT ('login' or 'home').
appId: com.encatch.expotester
---
- runFlow: common/setup.yaml
- runFlow: common/login.yaml
- runFlow: { file: common/pause.yaml, env: { SECONDS: 3 } }
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      true: ${EXPECT == 'login'}
    commands:
      - extendedWaitUntil:
          visible:
            id: setup-apply
          timeout: 30000
- runFlow:
    when:
      true: ${EXPECT == 'home'}
    commands:
      - extendedWaitUntil:
          visible:
            id: home-track-event
          timeout: 30000
- runFlow: { file: common/pause.yaml, env: { SECONDS: 5 } }
