# E6: a visitor (not identified) sees a survey on the login screen, then closes it with the X.
appId: com.encatch.expotester
---
- runFlow: common/setup.yaml
- runFlow: { file: common/wait-survey.yaml, env: { SURVEY_TIMEOUT: 20000 } }
- runFlow: { file: common/pause.yaml, env: { SECONDS: 3 } }
# Close with the X: for a visitor nothing is sent.
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "How would you rate the app\\?.*"
    timeout: 10000
- runFlow: { file: common/pause.yaml, env: { SECONDS: 3 } }
